title: Think Inside The Box # name of the site
author: djethro-s # name of site's author
url: "https://djethro-s.github.io"
baseurl: "/thinkinsidethebox" # HAPUS GARIS BAWAH DI SINI
description: > # description of the site (multiple lines allowed)
  People always said you need to think outside the box to solve problems. What if the real pain point can be solved by Thinking Inside The Box?

permalink: /:slug.html

favicon: "logo.png" # name+extension of favicon (which must be put on the root folder)
# goat_counter: "yoursitename" # put your GoatCounter name if you want to use GoatCounter analytics

# remote_theme: riggraz/no-style-please # if you are using GitHub Pages, change it to remote_theme: riggraz/no-style-please

theme_config:
  appearance: "dark" # can be "light", "dark" or "auto"
  back_home_text: "Come Back Home" # customize text for homepage link in post layout
  date_format: "%d-%m-%y" # customize how date is formatted
  show_description: false # show blog description in home page
  lowercase_titles: true # show titles in lowercase in lists

sass:
  style: compressed

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jektex

jektex:
  cache_dir: ".jektex-cache"
  ignore: ["*.xml"]
  silent: false
  macros:
    - ["\\Q", "\\mathbb{Q}"]
    - ["\\C", "\\mathbb{C}"]
